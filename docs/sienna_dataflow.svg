<svg xmlns='http://www.w3.org/2000/svg' width='1260' height='430' viewBox='0 0 1260 430'><defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#374151'/></marker></defs><rect x='0' y='0' width='1260' height='430' rx='12' fill='#ffffff'/><text x='630' y='32' font-family='Helvetica, Arial, sans-serif' font-size='16' font-weight='bold' fill='#1f2937' text-anchor='middle'>SIENNA dataflow</text><rect x='20' y='52' width='120' height='46' rx='8' fill='#ffffff' stroke='#9ca3af' stroke-width='1.2' stroke-dasharray='6 4'/><text x='80' y='71' font-family='Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' fill='#4b5563' text-anchor='middle'>driver software</text><text x='80' y='86' font-family='Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' fill='#4b5563' text-anchor='middle'>model_runner.py</text><polyline points='80,98 80,128' fill='none' stroke='#374151' stroke-width='1.4' marker-end='url(#ah)'/><text x='90' y='118' font-family='Helvetica, Arial, sans-serif' font-size='10.5' font-weight='normal' fill='#4b5563' text-anchor='start'>layers, buffers</text><rect x='209' y='62' width='996' height='225' rx='14' fill='none' stroke='#9ca3af' stroke-width='1.4' stroke-dasharray='6 4'/><text x='705' y='84' font-family='Helvetica, Arial, sans-serif' font-size='12.5' font-weight='normal' fill='#4b5563' text-anchor='middle' font-style='italic'>sienna_layer: schedules a whole network layer in hardware (tiles, weight reuse, bias, residual, int8 epilogue)</text><rect x='20' y='130' width='120' height='100' rx='10' fill='#f3f4f6' stroke='#6b7280' stroke-width='1.6'/><text x='80' y='160' font-family='Helvetica, Arial, sans-serif' font-size='13.5' font-weight='normal' fill='#1f2937' text-anchor='middle'>Host interface</text><text x='80' y='178' font-family='Helvetica, Arial, sans-serif' font-size='13.5' font-weight='normal' fill='#1f2937' text-anchor='middle'>(hardware)</text><text x='80' y='200' font-family='Helvetica, Arial, sans-serif' font-size='10.5' font-weight='normal' fill='#4b5563' text-anchor='middle'>DMA or</text><text x='80' y='213' font-family='Helvetica, Arial, sans-serif' font-size='10.5' font-weight='normal' fill='#4b5563' text-anchor='middle'>sienna_layer streams</text><rect x='215' y='115' width='220' height='135' rx='10' fill='#dbeafe' stroke='#2563eb' stroke-width='1.6'/><text x='325.0' y='142' font-family='Helvetica, Arial, sans-serif' font-size='15' font-weight='bold' fill='#1f2937' text-anchor='middle'>Matrix engine</text><text x='325.0' y='166' font-family='Helvetica, Arial, sans-serif' font-size='13' font-weight='normal' fill='#1f2937' text-anchor='middle'>SystolicMesh</text><text x='325.0' y='184' font-family='Helvetica, Arial, sans-serif' font-size='13' font-weight='normal' fill='#1f2937' text-anchor='middle'>C = A × B + bias</text><text x='325.0' y='202' font-family='Helvetica, Arial, sans-serif' font-size='13' font-weight='normal' fill='#1f2937' text-anchor='middle'>N² MACs per cycle</text><text x='325.0' y='220' font-family='Helvetica, Arial, sans-serif' font-size='13' font-weight='normal' fill='#1f2937' text-anchor='middle'>weight cache</text><rect x='515' y='115' width='220' height='135' rx='10' fill='#dcfce7' stroke='#16a34a' stroke-width='1.6'/><text x='625.0' y='142' font-family='Helvetica, Arial, sans-serif' font-size='15' font-weight='bold' fill='#1f2937' text-anchor='middle'>Activation</text><text x='625.0' y='166' font-family='Helvetica, Arial, sans-serif' font-size='13' font-weight='normal' fill='#1f2937' text-anchor='middle'>GPNAE lanes (32 / 128)</text><text x='625.0' y='184' font-family='Helvetica, Arial, sans-serif' font-size='13' font-weight='normal' fill='#1f2937' text-anchor='middle'>SELU · sigmoid · tanh</text><text x='625.0' y='202' font-family='Helvetica, Arial, sans-serif' font-size='13' font-weight='normal' fill='#1f2937' text-anchor='middle'>fitted polynomials</text><text x='625.0' y='220' font-family='Helvetica, Arial, sans-serif' font-size='13' font-weight='normal' fill='#1f2937' text-anchor='middle'>ReLU · linear bypass</text><rect x='815' y='115' width='160' height='135' rx='10' fill='#fef3c7' stroke='#d97706' stroke-width='1.6'/><text x='895.0' y='142' font-family='Helvetica, Arial, sans-serif' font-size='15' font-weight='bold' fill='#1f2937' text-anchor='middle'>Max pooling</text><text x='895.0' y='166' font-family='Helvetica, Arial, sans-serif' font-size='13' font-weight='normal' fill='#1f2937' text-anchor='middle'>Maxpool_2D lanes,</text><text x='895.0' y='184' font-family='Helvetica, Arial, sans-serif' font-size='13' font-weight='normal' fill='#1f2937' text-anchor='middle'>2-D windows</text><rect x='1050' y='115' width='150' height='135' rx='10' fill='#fce7f3' stroke='#db2777' stroke-width='1.6'/><text x='1125.0' y='142' font-family='Helvetica, Arial, sans-serif' font-size='15' font-weight='bold' fill='#1f2937' text-anchor='middle'>Dropout</text><text x='1125.0' y='166' font-family='Helvetica, Arial, sans-serif' font-size='13' font-weight='normal' fill='#1f2937' text-anchor='middle'>LFSR mask</text><text x='1125.0' y='184' font-family='Helvetica, Arial, sans-serif' font-size='13' font-weight='normal' fill='#1f2937' text-anchor='middle'>(training mode)</text><polyline points='140,175 213,175' fill='none' stroke='#374151' stroke-width='2' marker-end='url(#ah)'/><polyline points='211,192 142,192' fill='none' stroke='#374151' stroke-width='1.2' stroke-dasharray='6 4' marker-end='url(#ah)'/><text x='176.5' y='165' font-family='Helvetica, Arial, sans-serif' font-size='10.5' font-weight='normal' fill='#4b5563' text-anchor='middle'>set</text><text x='176.5' y='207' font-family='Helvetica, Arial, sans-serif' font-size='9.5' font-weight='normal' fill='#4b5563' text-anchor='middle'>credits</text><text x='176.5' y='220' font-family='Helvetica, Arial, sans-serif' font-size='9.5' font-weight='normal' fill='#4b5563' text-anchor='middle'>staging</text><polyline points='435,175 513,175' fill='none' stroke='#374151' stroke-width='2' marker-end='url(#ah)'/><polyline points='511,192 437,192' fill='none' stroke='#374151' stroke-width='1.2' stroke-dasharray='6 4' marker-end='url(#ah)'/><text x='474.0' y='165' font-family='Helvetica, Arial, sans-serif' font-size='10.5' font-weight='normal' fill='#4b5563' text-anchor='middle'>result beats</text><text x='474.0' y='207' font-family='Helvetica, Arial, sans-serif' font-size='9.5' font-weight='normal' fill='#4b5563' text-anchor='middle'>credits</text><text x='474.0' y='220' font-family='Helvetica, Arial, sans-serif' font-size='9.5' font-weight='normal' fill='#4b5563' text-anchor='middle'>result bank</text><polyline points='735,175 813,175' fill='none' stroke='#374151' stroke-width='2' marker-end='url(#ah)'/><polyline points='811,192 737,192' fill='none' stroke='#374151' stroke-width='1.2' stroke-dasharray='6 4' marker-end='url(#ah)'/><text x='774.0' y='165' font-family='Helvetica, Arial, sans-serif' font-size='10.5' font-weight='normal' fill='#4b5563' text-anchor='middle'>activations</text><text x='774.0' y='207' font-family='Helvetica, Arial, sans-serif' font-size='9.5' font-weight='normal' fill='#4b5563' text-anchor='middle'>credits</text><text x='774.0' y='220' font-family='Helvetica, Arial, sans-serif' font-size='9.5' font-weight='normal' fill='#4b5563' text-anchor='middle'>activation bank</text><polyline points='975,175 1048,175' fill='none' stroke='#374151' stroke-width='2' marker-end='url(#ah)'/><polyline points='1046,192 977,192' fill='none' stroke='#374151' stroke-width='1.2' stroke-dasharray='6 4' marker-end='url(#ah)'/><text x='1011.5' y='165' font-family='Helvetica, Arial, sans-serif' font-size='10.5' font-weight='normal' fill='#4b5563' text-anchor='middle'>pooled words</text><text x='1011.5' y='207' font-family='Helvetica, Arial, sans-serif' font-size='9.5' font-weight='normal' fill='#4b5563' text-anchor='middle'>credits</text><polyline points='1200,175 1250,175' fill='none' stroke='#374151' stroke-width='2' marker-end='url(#ah)'/><polyline points='1248,192 1202,192' fill='none' stroke='#374151' stroke-width='1.2' stroke-dasharray='6 4' marker-end='url(#ah)'/><text x='1225.0' y='165' font-family='Helvetica, Arial, sans-serif' font-size='10.5' font-weight='normal' fill='#4b5563' text-anchor='middle'>out</text><text x='1225.0' y='207' font-family='Helvetica, Arial, sans-serif' font-size='9.5' font-weight='normal' fill='#4b5563' text-anchor='middle'>credits</text><text x='630' y='320' font-family='Helvetica, Arial, sans-serif' font-size='12.5' font-weight='normal' fill='#4b5563' text-anchor='middle'>Every boundary is a credit link: the receiver grants one credit per free slot (dashed), the sender spends one per transfer (solid).</text><text x='630' y='342' font-family='Helvetica, Arial, sans-serif' font-size='12.5' font-weight='normal' fill='#4b5563' text-anchor='middle'>Nothing overruns or is dropped; a stalled output backs up stage by stage to the host. Up to 15 sets are in flight.</text><text x='630' y='364' font-family='Helvetica, Arial, sans-serif' font-size='12.5' font-weight='normal' fill='#4b5563' text-anchor='middle'>Each GPNAE lane and each pooling lane also has its own credit link.</text><text x='630' y='400' font-family='Helvetica, Arial, sans-serif' font-size='13' font-weight='bold' fill='#374151' text-anchor='middle'>Every stage builds in fp32, bf16 or int8 (int32 sums, TFLite requantization before the lanes)</text></svg>
