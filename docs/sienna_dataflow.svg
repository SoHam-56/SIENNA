<svg xmlns='http://www.w3.org/2000/svg' width='1180' height='360' viewBox='0 0 1180 360'><defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#374151'/></marker></defs><rect x='0' y='0' width='1180' height='360' rx='12' fill='#ffffff'/><text x='590' y='34' font-family='Helvetica, Arial, sans-serif' font-size='16' font-weight='bold' fill='#1f2937' text-anchor='middle'>SIENNA dataflow</text><rect x='150' y='62' width='1010' height='200' rx='14' fill='none' stroke='#9ca3af' stroke-width='1.4' stroke-dasharray='6 4'/><text x='655' y='84' font-family='Helvetica, Arial, sans-serif' font-size='12.5' font-weight='normal' fill='#4b5563' text-anchor='middle' font-style='italic'>sienna_layer: schedules a whole network layer in hardware (tiles, weight reuse, bias, residual, int8 epilogue)</text><rect x='20' y='120' width='110' height='100' rx='10' fill='#f3f4f6' stroke='#6b7280' stroke-width='1.6'/><text x='75' y='160' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='normal' fill='#1f2937' text-anchor='middle'>Host</text><text x='75' y='178' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='normal' fill='#1f2937' text-anchor='middle'>streams A, B</text><text x='75' y='200' font-family='Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' fill='#4b5563' text-anchor='middle'>model_runner.py</text><rect x='175' y='105' width='250' height='135' rx='10' fill='#dbeafe' stroke='#2563eb' stroke-width='1.6'/><text x='300.0' y='132' font-family='Helvetica, Arial, sans-serif' font-size='15' font-weight='bold' fill='#1f2937' text-anchor='middle'>Matrix engine</text><text x='300.0' y='156' font-family='Helvetica, Arial, sans-serif' font-size='13' font-weight='normal' fill='#1f2937' text-anchor='middle'>SystolicMesh</text><text x='300.0' y='174' font-family='Helvetica, Arial, sans-serif' font-size='13' font-weight='normal' fill='#1f2937' text-anchor='middle'>C = A × B + bias</text><text x='300.0' y='192' font-family='Helvetica, Arial, sans-serif' font-size='13' font-weight='normal' fill='#1f2937' text-anchor='middle'>N² MACs per cycle</text><text x='300.0' y='210' font-family='Helvetica, Arial, sans-serif' font-size='13' font-weight='normal' fill='#1f2937' text-anchor='middle'>weight cache</text><rect x='465' y='105' width='240' height='135' rx='10' fill='#dcfce7' stroke='#16a34a' stroke-width='1.6'/><text x='585.0' y='132' font-family='Helvetica, Arial, sans-serif' font-size='15' font-weight='bold' fill='#1f2937' text-anchor='middle'>Activation</text><text x='585.0' y='156' font-family='Helvetica, Arial, sans-serif' font-size='13' font-weight='normal' fill='#1f2937' text-anchor='middle'>32 GPNAE lanes</text><text x='585.0' y='174' font-family='Helvetica, Arial, sans-serif' font-size='13' font-weight='normal' fill='#1f2937' text-anchor='middle'>SELU · sigmoid · tanh</text><text x='585.0' y='192' font-family='Helvetica, Arial, sans-serif' font-size='13' font-weight='normal' fill='#1f2937' text-anchor='middle'>fitted polynomials</text><text x='585.0' y='210' font-family='Helvetica, Arial, sans-serif' font-size='13' font-weight='normal' fill='#1f2937' text-anchor='middle'>ReLU · linear bypass</text><rect x='745' y='105' width='180' height='135' rx='10' fill='#fef3c7' stroke='#d97706' stroke-width='1.6'/><text x='835.0' y='132' font-family='Helvetica, Arial, sans-serif' font-size='15' font-weight='bold' fill='#1f2937' text-anchor='middle'>Max pooling</text><text x='835.0' y='156' font-family='Helvetica, Arial, sans-serif' font-size='13' font-weight='normal' fill='#1f2937' text-anchor='middle'>2-D windows,</text><text x='835.0' y='174' font-family='Helvetica, Arial, sans-serif' font-size='13' font-weight='normal' fill='#1f2937' text-anchor='middle'>spread over lanes</text><rect x='965' y='105' width='170' height='135' rx='10' fill='#fce7f3' stroke='#db2777' stroke-width='1.6'/><text x='1050.0' y='132' font-family='Helvetica, Arial, sans-serif' font-size='15' font-weight='bold' fill='#1f2937' text-anchor='middle'>Dropout</text><text x='1050.0' y='156' font-family='Helvetica, Arial, sans-serif' font-size='13' font-weight='normal' fill='#1f2937' text-anchor='middle'>LFSR mask</text><text x='1050.0' y='174' font-family='Helvetica, Arial, sans-serif' font-size='13' font-weight='normal' fill='#1f2937' text-anchor='middle'>(training mode)</text><polyline points='130,170 173,170' fill='none' stroke='#374151' stroke-width='2' marker-end='url(#ah)'/><text x='152' y='160' font-family='Helvetica, Arial, sans-serif' font-size='1' font-weight='normal' fill='#1f2937' text-anchor='middle'></text><polyline points='425,172 463,172' fill='none' stroke='#374151' stroke-width='2' marker-end='url(#ah)'/><polyline points='705,172 743,172' fill='none' stroke='#374151' stroke-width='2' marker-end='url(#ah)'/><polyline points='925,172 963,172' fill='none' stroke='#374151' stroke-width='2' marker-end='url(#ah)'/><text x='445' y='163' font-family='Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' fill='#4b5563' text-anchor='middle'>wide</text><text x='445' y='192' font-family='Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' fill='#4b5563' text-anchor='middle'>read</text><polyline points='1135,172 1172,172' fill='none' stroke='#374151' stroke-width='2' marker-end='url(#ah)'/><text x='1152' y='160' font-family='Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' fill='#4b5563' text-anchor='middle'>out</text><text x='1150' y='300' font-family='Helvetica, Arial, sans-serif' font-size='1' font-weight='normal' fill='#1f2937' text-anchor='middle'></text><polyline points='1065,240 1065,292 75,292 75,222' fill='none' stroke='#374151' stroke-width='1.6' stroke-dasharray='6 4' marker-end='url(#ah)'/><text x='570' y='312' font-family='Helvetica, Arial, sans-serif' font-size='12.5' font-weight='normal' fill='#4b5563' text-anchor='middle'>credits: up to 15 sets in flight; the host starts a new set whenever a bank is free, so every stage works on a different set</text><text x='590' y='344' font-family='Helvetica, Arial, sans-serif' font-size='13' font-weight='bold' fill='#374151' text-anchor='middle'>Every stage builds in fp32, bf16 or int8 (int32 sums, TFLite requantization before the lanes)</text></svg>
